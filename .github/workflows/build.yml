name: Build and Package

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.base_ref == 'refs/heads/main' || github.ref_type == 'tag'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Get tag name
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Sync ServerVersion in manifest
        run: |
          SERVER_VERSION=$(sed -n '/<artifactId>Server<\/artifactId>/{
          n
          s/.*<version>\(.*\)<\/version>.*/\1/p
          }' pom.xml)
          sed -i "s/\"ServerVersion\": \".*\"/\"ServerVersion\": \"$SERVER_VERSION\"/" src/main/resources/manifest.json

      - name: Build with Maven
        run: mvn clean package -Drevision=${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gportal-query-${{env.VERSION}}.jar
          path: target/gportal-query-${{ env.VERSION }}.jar

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/gportal-query-${{ env.VERSION }}.jar
          token: ${{ secrets.GITHUB_TOKEN }}

    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}

  curseforge:
    needs: build
    uses: ./.github/workflows/curseforge-publish.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
