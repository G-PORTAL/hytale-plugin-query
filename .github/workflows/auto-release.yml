name: Auto Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: contains(github.event.head_commit.message, 'dependabot')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Generate version
        id: version
        run: |
          DATE=$(date +%Y.%m.%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${DATE}-${SHORT_SHA}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync ServerVersion in manifest
        run: |
          SERVER_VERSION=$(sed -n '/<artifactId>Server<\/artifactId>/{
          n
          s/.*<version>\(.*\)<\/version>.*/\1/p
          }' pom.xml)
          test -n "$SERVER_VERSION" || { echo "Server version not found in pom.xml"; exit 1; }
          # Hytale rejects a bare version unless the patch is 0 -> target the whole minor line (0.7.2 -> ^0.7.0)
          SERVER_RANGE="^${SERVER_VERSION%.*}.0"
          sed -i "s/\"ServerVersion\": \".*\"/\"ServerVersion\": \"$SERVER_RANGE\"/" src/main/resources/manifest.json
          grep '"ServerVersion"' src/main/resources/manifest.json

      - name: Build with Maven
        run: mvn clean package -Drevision=${{ env.VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: target/gportal-query-${{ env.VERSION }}.jar
          generate_release_notes: true

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

  curseforge:
    needs: release
    uses: ./.github/workflows/curseforge-publish.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
